# ==============================================================================
# DVC Pipeline Specification
# AI-Based Interview Preparation Assistant
# Phase 1 Pipeline: Reproducible Data Processing & Baseline Modeling
# ==============================================================================

stages:
  prepare_dataset:
    cmd: python src/data/prepare_dataset.py
    deps:
      - data/external/mohler
      - src/data/prepare_dataset.py
    params:
      - data.raw_data_path
      - data.raw_data_csv_path
    outs:
      - data/raw/interview_data.parquet:
          cache: true
      - data/raw/interview_data.csv:
          cache: true

  load_data:
    cmd: python src/data/load_data.py
    deps:
      - data/raw/interview_data.parquet
      - src/data/load_data.py
    params:
      - data.raw_data_path
      - data.text_columns
      - data.group_column
      - data.target_column
      - data.label_thresholds
    outs:
      - data/interim/loaded_data.parquet:
          cache: true

  preprocess:
    cmd: python src/data/preprocess.py
    deps:
      - data/interim/loaded_data.parquet
      - src/data/preprocess.py
    params:
      - split.test_size
      - split.validation_size
      - split.group_column
      - split.random_state
    outs:
      - data/processed/train.parquet:
          cache: true
      - data/processed/val.parquet:
          cache: true
      - data/processed/test.parquet:
          cache: true

  feature_engineering:
    cmd: python -m src.features.build_features
    deps:
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/test.parquet
      - src/features/build_features.py
    params:
      - features.tfidf.max_features
      - features.tfidf.ngram_range
      - features.tfidf.stop_words
      - features.tfidf.min_df
      - features.tfidf.sublinear_tf
      - features.engineered_features.include_length
      - features.engineered_features.include_reference_similarity
    outs:
      - models/feature_pipeline.joblib:
          cache: true

  train_baseline:
    cmd: MLFLOW_ALLOW_FILE_STORE=true python src/models/train_baseline.py
    deps:
      - data/processed/train.parquet
      - models/feature_pipeline.joblib
      - src/models/train_baseline.py
    params:
      - model.baseline.algorithm
      - model.baseline.c_param
      - model.baseline.solver
      - model.baseline.max_iter
      - model.baseline.random_state
    outs:
      - models/baseline_model.joblib:
          cache: true

  train_compare:
    cmd: MLFLOW_ALLOW_FILE_STORE=true python src/models/train_compare.py
    deps:
      - data/processed/train.parquet
      - data/processed/val.parquet
      - models/feature_pipeline.joblib
      - src/models/train_compare.py
    params:
      - model.random_forest.algorithm
      - model.random_forest.n_estimators
      - model.random_forest.max_depth
      - model.random_forest.random_state
    outs:
      - models/rf_model.joblib:
          cache: true

  evaluate:
    cmd: MLFLOW_ALLOW_FILE_STORE=true python src/evaluation/evaluate.py
    deps:
      - data/processed/test.parquet
      - models/baseline_model.joblib
      - models/rf_model.joblib
      - models/feature_pipeline.joblib
      - src/evaluation/evaluate.py
    params:
      - evaluation.primary_metric
      - evaluation.selection_rule
    metrics:
      - reports/metrics.json:
          cache: false
    plots:
      - reports/figures/confusion_matrix.png:
          cache: false
      - reports/figures/confusion_matrix_random_forest.png:
          cache: false
      - reports/figures/confusion_matrix_logistic_regression.png:
          cache: false
      - reports/figures/class_distribution.png:
          cache: false
      - reports/figures/answer_length_by_class.png:
          cache: false